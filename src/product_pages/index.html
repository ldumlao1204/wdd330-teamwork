<!doctype html>

<html lang="en">

    <link rel="stylesheet" href="../css/style.css" />

    <script src="../js/product.js" type="module"></script>

  <body>

    <main class="divider">

        <h2 class="divider"></h2>

        <img id="Image" src="" alt="product image" />

        <div class="product-detail__add">
