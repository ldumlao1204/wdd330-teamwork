<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header">
    </header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <section class="order-details">
        <form>
          <label for="firstname">First Name</label>
          <input type="text" id="firstname" name="firstname" required />
          
          <label for="lastname">Last Name</label>
          <input type="text" id="lastname" name="lastname" required />

          <hr>

          <label for="street-address">Street Address</label>
          <textarea id="street-address" name="street-address" required></textarea>

          <label for="city">City</label>
          <input type="text" id="city" name="city" required />

          <label for="state">State</label>
          <input type="text" id="state" name="state" required />

          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" required />

          <hr>

          <label for="card-number">Card Number</label>
          <input type="text" id="card-number" name="card-number" required />

          <label for="expiration">Expiration Date</label>
          <input type="text" id="expiration" name="expiration" placeholder="MM/YY" required />

          <label for="cvv">CVV</label>
          <input type="text" id="cvv" name="cvv" required />

          <button type="submit" class="btn btn--primary">Place Order</button>
        </form>
        <hr>
        <h2>Order Summary</h2>
        <h3 id="sub-total" class="sub-total">Subtotal: $0.00</h3>
        <h3 id="tax" class="tax">Tax: $0.00</h3>
        <h3 id="shipping-estimate" class="shipping-estimate">Shipping Estimate: $0.00</h3>
        <h3 id="order-total" class="order-total">Order Total: $0.00</h3>

      </section>
      <section class="order-summary" id="order-summary">
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
